<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro | StockFlow</title><link rel="stylesheet" href="css/style.css"></head><body><header class="top"><div class="container nav"><a class="brand" href="index.html"><span class="brand-icon">SF</span><span>StockFlow</span></a><button class="menu" id="menuBtn">☰</button><nav id="nav"><a href="index.html">Dashboard</a><a href="produtos.html">Produtos</a><a class="active" href="cadastro.html">Cadastrar</a><a href="categorias.html">Categorias</a><a href="historico.html">Histórico</a><button class="nav-logout" id="logout">Sair</button></nav></div></header><main class="container page"><div class="page-head"><div><span class="eyebrow">FORMULÁRIO</span><h1 id="formTitle">Cadastrar produto</h1><p>Dados gravados no banco de dados.</p></div><a class="btn ghost" href="produtos.html">← Voltar</a></div><form id="produtoForm" class="form-card"><div class="form-grid"><label>Nome do produto *<input id="nome" required maxlength="80"></label><label>Categoria *<select id="categoria" required></select></label><label>Preço (R$) *<input id="preco" type="number" min="0" step=".01" required></label><label>Estoque *<input id="estoque" type="number" min="0" step="1" required></label><label class="full">URL da imagem <span class="optional">opcional</span><input id="imagem" type="url"></label></div><div class="preview" id="preview"><span>Prévia da imagem</span></div><div class="form-actions"><button class="btn primary" type="submit" id="submit">Cadastrar produto</button><a class="btn ghost" href="produtos.html">Cancelar</a></div></form></main><script>let editId=new URLSearchParams(location.search).get('id');async function api(u,o={}){const r=await fetch(u,{...o,headers:{'Content-Type':'application/json',...(o.headers||{})}});if(r.status===401){location.href='login.html';return}const d=await r.json();if(!r.ok)throw Error(d.erro);return d}document.addEventListener('DOMContentLoaded',async()=>{menuBtn.onclick=()=>nav.classList.toggle('open');logout.onclick=async()=>{await fetch('/api/logout',{method:'POST'});location.href='login.html'};const cs=await api('/api/categorias');categoria.innerHTML='<option value="">Selecione</option>'+cs.map(c=>'<option value="'+c.id+'">'+c.nome+'</option>').join('');if(editId){const ps=await api('/api/produtos'),p=ps.find(x=>String(x.id)===editId);if(p){formTitle.textContent='Alterar produto';submit.textContent='Salvar alteração';nome.value=p.nome;categoria.value=p.categoria_id;preco.value=p.preco;estoque.value=p.estoque;imagem.value=p.imagem||'';preview.innerHTML=p.imagem?'<img src="'+p.imagem+'" alt="Prévia">':'<span>Prévia da imagem</span>'}}imagem.oninput=()=>preview.innerHTML=imagem.value?'<img src="'+imagem.value+'" alt="Prévia">':'<span>Prévia da imagem</span>';produtoForm.onsubmit=async e=>{e.preventDefault();try{const body={nome:nome.value,categoria_id:Number(categoria.value),preco:Number(preco.value),estoque:Number(estoque.value),imagem:imagem.value};await api(editId?'/api/produtos/'+editId:'/api/produtos',{method:editId?'PUT':'POST',body:JSON.stringify(body)});location.href='produtos.html'}catch(e){alert(e.message)}}});</script></body></html>
