<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro | StockFlow</title><link rel="stylesheet" href="css/style.css"><script defer src="js/app.js"></script></head><body><header class="top"><div class="container nav"><a class="brand" href="index.html"><span class="brand-icon">SF</span><span>StockFlow</span></a><button class="menu" id="menuBtn">☰</button><nav id="nav"><a href="index.html">Dashboard</a><a href="produtos.html">Produtos</a><a class="active" href="cadastro.html">Cadastrar</a><a href="README.md">Documentação</a></nav></div></header><main class="container page"><div class="page-head"><div><span class="eyebrow">FORMULÁRIO</span><h1 id="formTitle">Cadastrar produto</h1><p>Preencha os campos para adicionar um novo produto ao estoque.</p></div><a class="btn ghost" href="produtos.html">← Voltar</a></div><form id="produtoForm" class="form-card"><input type="hidden" id="id"><div class="form-grid"><label>Nome do produto *<input id="nome" required maxlength="80" placeholder="Ex.: Fone Bluetooth"></label><label>Categoria *<select id="categoria" required><option value="">Selecione</option><option>Eletrônicos</option><option>Casa</option><option>Moda</option><option>Beleza</option><option>Esportes</option><option>Livros</option></select></label><label>Preço (R$) *<input id="preco" type="number" min="0" step="0.01" required placeholder="0,00"></label><label>Estoque *<input id="estoque" type="number" min="0" step="1" required placeholder="0"></label><label class="full">URL da imagem <span class="optional">opcional</span><input id="imagem" type="url" placeholder="https://exemplo.com/produto.jpg"></label></div><div class="preview" id="preview"><span>Prévia da imagem</span></div><div class="form-actions"><button class="btn primary" type="submit" id="submit">Cadastrar produto</button><button class="btn ghost" type="button" id="limpar">Limpar</button></div></form></main><footer><div class="container footer-inner"><strong>StockFlow</strong><span>© 2026 — Projeto acadêmico independente.</span></div></footer></body></html>
