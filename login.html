<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | StockFlow</title><link rel="stylesheet" href="css/style.css"></head><body class="login-page"><main class="login-card"><div class="brand login-brand"><span class="brand-icon">SF</span><strong>StockFlow</strong></div><span class="eyebrow">ÁREA ADMINISTRATIVA</span><h1>Entrar no sistema</h1><p>Acesse o painel para controlar produtos, estoque, categorias e histórico.</p><form id="loginForm"><label>E-mail<input id="email" type="email" value="admin@stockflow.local" required></label><label>Senha<input id="senha" type="password" value="admin123" required></label><button class="btn primary" type="submit">Entrar →</button><div id="msg" class="login-msg"></div></form><small>Demo acadêmica: admin@stockflow.local / admin123</small></main><script>const f=document.getElementById('loginForm');f.addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,senha:senha.value})});const d=await r.json();if(r.ok)location.href='index.html';else msg.textContent=d.erro||'Erro ao entrar'});</script></body></html>
